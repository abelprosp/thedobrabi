apiVersion: apps/v1
kind: Deployment
metadata:
  name: thedobra-analytics
  labels:
    app: thedobra-analytics
    app.kubernetes.io/name: thedobra
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: thedobra-analytics
  template:
    metadata:
      labels:
        app: thedobra-analytics
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: thedobra/analytics:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: thedobra-config
            - secretRef:
                name: thedobra-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: thedobra-analytics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: thedobra-analytics
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
