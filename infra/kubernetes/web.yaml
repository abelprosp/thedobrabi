apiVersion: apps/v1
kind: Deployment
metadata:
  name: thedobra-web
  labels:
    app: thedobra-web
    app.kubernetes.io/name: thedobra
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: thedobra-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: thedobra-web
        app.kubernetes.io/component: web
    spec:
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: thedobra-web
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: thedobra/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3010
          env:
            - name: API_PROXY_URL
              value: http://thedobra-api:8080
            - name: PORT
              value: "3010"
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: thedobra-web
spec:
  selector:
    app: thedobra-web
  ports:
    - name: http
      port: 3010
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: thedobra-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: thedobra-web
  minReplicas: 2
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
