apiVersion: v1
kind: ConfigMap
metadata:
  name: thedobra-config
  labels:
    app.kubernetes.io/name: thedobra
data:
  APP_ENV: production
  APP_HTTP_ADDR: ":8080"
  APP_PUBLIC_URL: https://api.thedobra.dev
  WEB_ORIGIN: https://app.thedobra.dev
  CLICKHOUSE_DATABASE: thedobra
  CLICKHOUSE_USER: thedobra
  MINIO_BUCKET: thedobra
  MINIO_USE_SSL: "true"
  OPENAI_BASE_URL: https://api.openai.com/v1
  OPENAI_MODEL: gpt-4o-mini
