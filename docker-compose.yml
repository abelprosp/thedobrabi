services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: thedobra
      POSTGRES_PASSWORD: thedobra
      POSTGRES_DB: thedobra
    ports:
      # Host ports default off the well-known ones so a VPS with an incomplete .env
      # does not collide with system Postgres/Redis/ClickHouse/MinIO/Kafka.
      # API/web are NOT in this compose — they need a published host port (or run on this network).
      # If the API also runs in Compose, you can omit `ports` and use hostname `postgres` in POSTGRES_DSN.
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thedobra"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: thedobra
      CLICKHOUSE_USER: thedobra
      CLICKHOUSE_PASSWORD: thedobra
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-19009}:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./infra/docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user thedobra --password thedobra --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: thedobra
      MINIO_ROOT_PASSWORD: thedobra-secret
    ports:
      - "${MINIO_API_PORT:-19010}:9000"
      - "${MINIO_CONSOLE_PORT:-19011}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
    ports:
      - "${KAFKA_PORT:-19092}:19092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  redisdata:
  chdata:
  miniodata:
  redpandadata:
