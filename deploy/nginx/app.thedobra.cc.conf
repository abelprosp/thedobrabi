# TheDobra — app.thedobra.cc
# Copiar para: /etc/nginx/sites-available/app.thedobra.cc
#   sudo ln -s /etc/nginx/sites-available/app.thedobra.cc /etc/nginx/sites-enabled/
#
# Reverse proxy (mesmo host):
#   Next.js  apps/web     → 127.0.0.1:13010  (resto do site)
#   API Go   services/api → 127.0.0.1:2003   (/api/v1, /healthz, /readyz, /scim/v2)
#
# O browser chama caminhos relativos /api/v1/... (apps/web/src/lib/api.ts).
# Não é preciso NEXT_PUBLIC_API_URL. Fallback Next: API_PROXY_URL=http://127.0.0.1:2003
#
# Primeira instalação (certificados Let's Encrypt ainda não existem):
#   1. Deixa o bloco 443 comentado (já vem assim) para `nginx -t` passar.
#   2. sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d app.thedobra.cc
#      O certbot obtém o certificado, activa 443 e o redirect HTTP→HTTPS.
#   4. Se o certbot não reescrever este ficheiro, descomenta o bloco 443
#      e no bloco 80 troca o proxy por: return 301 https://$host$request_uri;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream thedobra_web {
    server 127.0.0.1:13010;
    keepalive 32;
}

upstream thedobra_api {
    server 127.0.0.1:2003;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.thedobra.cc;

    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Depois do certbot, descomenta a linha abaixo e comenta os `location` de proxy neste bloco 80.
    # return 301 https://$host$request_uri;

    location /api/ {
        proxy_pass http://thedobra_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /healthz {
        proxy_pass http://thedobra_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /readyz {
        proxy_pass http://thedobra_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /scim/ {
        proxy_pass http://thedobra_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://thedobra_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

