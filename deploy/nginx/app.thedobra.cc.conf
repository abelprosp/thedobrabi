# TheDobra — app.thedobra.cc
# Copiar para: /etc/nginx/sites-available/app.thedobra.cc
#   sudo ln -s /etc/nginx/sites-available/app.thedobra.cc /etc/nginx/sites-enabled/
#
# Reverse proxy (mesmo host):
#   Next.js  apps/web     → 127.0.0.1:13010  (resto do site)
#   API Go   services/api → 127.0.0.1:2003   (/api/v1, /healthz, /readyz, /scim/v2)
#
# IMPORTANTE: a API deve escutar só em 127.0.0.1 (ex. APP_HTTP_ADDR=127.0.0.1:2003).
# Não exponha a porta 2003 publicamente — o Nginx faz o proxy.
#
# O browser chama caminhos relativos /api/v1/... (apps/web/src/lib/api.ts).
# Não é preciso NEXT_PUBLIC_API_URL. Fallback Next: API_PROXY_URL=http://127.0.0.1:2003
#
# O bloco 443 abaixo é deliberadamente activo. Sem ele, uma requisição HTTPS
# cai no primeiro vhost 443 da VPS (potencialmente outro projecto).
# Os certificados devem existir antes de instalar este ficheiro.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream thedobra_web {
    server 127.0.0.1:13010;
    keepalive 32;
}

upstream thedobra_api {
    # API bound to loopback only — see APP_HTTP_ADDR=127.0.0.1:2003
    server 127.0.0.1:2003;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.thedobra.cc;

    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.thedobra.cc;

    ssl_certificate /etc/letsencrypt/live/app.thedobra.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.thedobra.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://thedobra_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
    location /healthz { proxy_pass http://thedobra_api; }
    location /readyz { proxy_pass http://thedobra_api; }
    location /scim/ { proxy_pass http://thedobra_api; }
    # Os nomes dos chunks do App Router podem conter parênteses literais,
    # por exemplo app/(app)/layout-<hash>.js. Servir pelo Nginx evita que o
    # parser/router do Next transforme esse caminho em HTTP 400. O diretório
    # é trocado atomicamente pelo deploy e contém também assets de releases
    # anteriores para HTML cacheado continuar funcionando.
    location ^~ /_next/static/ {
        alias /root/thedobrabi/apps/web/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        proxy_pass http://thedobra_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
